name: Upload Evidence
description: Upload CI evidence artifacts

inputs:
  name:
    required: true
  path:
    required: true

runs:
  using: composite
  steps:
    - name: Upload evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: warn
        retention-days: 14
