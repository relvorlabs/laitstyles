name: Setup Node environment
description: Install pnpm, Node.js and locked dependencies after checkout

inputs:
  node-version:
    description: Node.js version used by CI
    required: false
    default: "25"

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install locked dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
