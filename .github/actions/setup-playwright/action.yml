name: Setup Playwright Browser Environment
description: Installs dependencies and Playwright browsers

inputs:
  project:
    required: true

runs:
  using: composite
  steps:
    - name: Cache Playwright browser
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install Chromium and OS dependencies
      shell: bash
      run: pnpm exec playwright install --with-deps chromium
