name: Resolve PR 7 conflicts

on:
  push:
    branches:
      - feat/storefront-v2-spec
    paths:
      - .github/workflows/resolve-pr7-conflicts.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out storefront branch
        uses: actions/checkout@v4
        with:
          ref: feat/storefront-v2-spec
          fetch-depth: 0

      - name: Merge main with storefront precedence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff -X ours origin/main -m "merge(main): resolve PR #7 with storefront v2 precedence"
          git rm .github/workflows/resolve-pr7-conflicts.yml
          git commit --amend --no-edit
          git push origin HEAD:feat/storefront-v2-spec
