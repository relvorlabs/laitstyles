name: Phase 6 lockfile repair

on:
  push:
    branches:
      - refactor/phase-6-storefront-state-zustand

permissions:
  contents: write

concurrency:
  group: phase-6-lockfile-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Phase 6
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/phase-6-storefront-state-zustand

      - name: Set up pnpm 11.13.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - name: Set up Node.js 25
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: pnpm

      - name: Regenerate the lockfile
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

      - name: Reject unrelated dependency drift
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only -- . ':(exclude)pnpm-lock.yaml' ':(exclude).github/workflows/phase-6-lockfile-repair.yml')"
          node <<'NODE'
          const fs = require('node:fs');
          const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8');
          const required = [
            "      zustand:\n        specifier: ^5.0.14",
            "  zustand@5.0.14:",
            "  zustand@5.0.14(@types/react@19.2.17)(react@19.2.4)(use-sync-external-store@1.6.0(react@19.2.4)):",
          ];
          for (const marker of required) {
            if (!lock.includes(marker)) throw new Error(`Generated lockfile is missing: ${marker}`);
          }
          NODE
          read added deleted _ < <(git diff --numstat -- pnpm-lock.yaml)
          test "${deleted:-0}" -eq 0
          test "${added:-0}" -le 40
          git diff --check

      - name: Commit generated lockfile and remove repair workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/phase-6-lockfile-repair.yml
          git add pnpm-lock.yaml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(phase-6): regenerate pnpm lockfile'
          git push origin HEAD:refactor/phase-6-storefront-state-zustand
