name: Phase 2 assembly

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  assemble-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Runner probe
        run: |
          echo "runner-ok" | tee phase2-diagnostic.log
          node --version | tee -a phase2-diagnostic.log
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-diagnostic-${{ github.run_attempt }}
          path: phase2-diagnostic.log
          if-no-files-found: error
          retention-days: 7
