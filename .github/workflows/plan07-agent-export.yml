name: Plan 07 Validation Probe

on:
  push:
    branches:
      - codex/plan-07-owner-finance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove hosted runner availability
        run: |
          node --version
          git rev-parse HEAD
