name: Runner Allocation Probe

on:
  pull_request:
    branches: [main]
    types: [synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Confirm runner allocation
        shell: bash
        run: |
          echo "runner=${{ matrix.runner }}"
          echo "os=${{ runner.os }}"
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
