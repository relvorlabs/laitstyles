name: Control Room V2 checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: control-room-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: always()
        shell: bash
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee lint.log

      - name: TypeScript
        if: always()
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsc --noEmit 2>&1 | tee typescript.log

      - name: Tests
        if: always()
        shell: bash
        run: |
          set -o pipefail
          pnpm exec vitest run --passWithNoTests 2>&1 | tee tests.log

      - name: Theme token audit
        if: always()
        shell: bash
        run: |
          set -o pipefail
          node scripts/control-room-phase7-theme-audit.mjs 2>&1 | tee theme-audit.log

      - name: Production build
        if: always()
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log

      - name: Browser viewport and interaction checks
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control-room-screenshots
          npm install --prefix /tmp/control-room-browser playwright@latest --no-save --omit=optional 2>&1 | tee browser.log
          PLAYWRIGHT=/tmp/control-room-browser/node_modules/.bin/playwright
          "$PLAYWRIGHT" install --with-deps chromium 2>&1 | tee -a browser.log

          ./node_modules/.bin/next start >> browser.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:3000/admin >/dev/null; then
              break
            fi
            sleep 1
          done

          routes=(
            "/"
            "/admin"
            "/admin/inventory"
            "/admin/inventory?presentation=table"
            "/admin/orders"
            "/admin/holds"
            "/admin/returns"
            "/admin/customers"
            "/admin/settings"
          )
          for route in "${routes[@]}"; do
            curl --silent --fail "http://127.0.0.1:3000${route}" >/dev/null
          done

          screenshot_routes=(
            "overview|/admin"
            "inventory-grid|/admin/inventory"
            "inventory-table|/admin/inventory?presentation=table"
            "orders|/admin/orders"
            "holds|/admin/holds"
            "returns|/admin/returns"
            "customers|/admin/customers"
            "settings|/admin/settings"
          )
          for viewport in 375,812 768,1024 1280,800; do
            label=${viewport/,/x}
            for entry in "${screenshot_routes[@]}"; do
              name=${entry%%|*}
              route=${entry#*|}
              "$PLAYWRIGHT" screenshot \
                --browser chromium \
                --viewport-size "$viewport" \
                --wait-for-timeout 1500 \
                --full-page \
                "http://127.0.0.1:3000${route}" \
                "control-room-screenshots/${name}-${label}.png" 2>&1 | tee -a browser.log
            done
          done

          detail_routes=(
            "inventory-detail|/admin/inventory?product=botanical-jeans"
            "orders-detail|/admin/orders?order=LS-20481"
            "holds-detail|/admin/holds?hold=hold-botanical"
            "customers-detail|/admin/customers?customer=customer-amara"
            "settings-team|/admin/settings?section=team"
          )
          for viewport in 375,812 1280,800; do
            label=${viewport/,/x}
            for entry in "${detail_routes[@]}"; do
              name=${entry%%|*}
              route=${entry#*|}
              "$PLAYWRIGHT" screenshot \
                --browser chromium \
                --viewport-size "$viewport" \
                --wait-for-timeout 1500 \
                --full-page \
                "http://127.0.0.1:3000${route}" \
                "control-room-screenshots/${name}-${label}.png" 2>&1 | tee -a browser.log
            done
          done

          scripts=(
            "control-room-phase3-check.mjs"
            "control-room-phase4-orders-check.mjs"
            "control-room-phase4-holds-check.mjs"
            "control-room-phase4-sales-returns-check.mjs"
            "control-room-phase5-customers-check.mjs"
            "control-room-phase6-settings-check.mjs"
            "control-room-phase7-theme-media-check.mjs"
            "control-room-phase7-theme-routes-check.mjs"
            "control-room-phase8-check.mjs"
            "control-room-inventory-catalogue-check.mjs"
          )
          for script in "${scripts[@]}"; do
            cp "scripts/${script}" "/tmp/control-room-browser/${script}"
            CONTROL_ROOM_BASE_URL=http://127.0.0.1:3000 \
              CONTROL_ROOM_SCREENSHOT_DIR="$GITHUB_WORKSPACE/control-room-screenshots" \
              node "/tmp/control-room-browser/${script}" 2>&1 | tee -a browser.log
          done

          cleanup
          trap - EXIT

      - name: React Doctor diagnostics
        if: always()
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx react-doctor@latest . --verbose --scope changed --base origin/main 2>&1 | tee react-doctor.log
          grep -a -i -q 'No issues found!' react-doctor.log

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-room-v2-logs
          path: |
            lint.log
            typescript.log
            tests.log
            theme-audit.log
            build.log
            browser.log
            react-doctor.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-room-v2-screenshots
          path: control-room-screenshots
          if-no-files-found: warn
          retention-days: 7
