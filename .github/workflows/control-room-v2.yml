name: Control Room V2 checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: control-room-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: always()
        shell: bash
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee lint.log

      - name: TypeScript
        if: always()
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsc --noEmit 2>&1 | tee typescript.log

      - name: Tests
        if: always()
        shell: bash
        run: |
          set -o pipefail
          pnpm exec vitest run --passWithNoTests 2>&1 | tee tests.log

      - name: Production build
        if: always()
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log

      - name: Browser viewport and interaction checks
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control-room-screenshots
          npm install --prefix /tmp/control-room-browser playwright@latest --no-save --omit=optional 2>&1 | tee browser.log
          PLAYWRIGHT=/tmp/control-room-browser/node_modules/.bin/playwright
          "$PLAYWRIGHT" install --with-deps chromium 2>&1 | tee -a browser.log

          ./node_modules/.bin/next start >> browser.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:3000/admin >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:3000/admin >/dev/null
          curl --silent --fail http://127.0.0.1:3000/admin/inventory >/dev/null
          curl --silent --fail http://127.0.0.1:3000/admin/orders >/dev/null
          curl --silent --fail http://127.0.0.1:3000/admin/holds >/dev/null
          curl --silent --fail http://127.0.0.1:3000/admin/returns >/dev/null
          curl --silent --fail http://127.0.0.1:3000/admin/customers >/dev/null
          curl --silent --fail http://127.0.0.1:3000/admin/settings >/dev/null

          for viewport in 375,812 768,1024 1280,800; do
            label=${viewport/,/x}
            "$PLAYWRIGHT" screenshot \
              --browser chromium \
              --viewport-size "$viewport" \
              --wait-for-timeout 1200 \
              --full-page \
              http://127.0.0.1:3000/admin \
              "control-room-screenshots/active-${label}.png" 2>&1 | tee -a browser.log

            "$PLAYWRIGHT" screenshot \
              --browser chromium \
              --viewport-size "$viewport" \
              --wait-for-timeout 1200 \
              --full-page \
              'http://127.0.0.1:3000/admin?view=new-store' \
              "control-room-screenshots/new-store-${label}.png" 2>&1 | tee -a browser.log

            "$PLAYWRIGHT" screenshot \
              --browser chromium \
              --viewport-size "$viewport" \
              --wait-for-timeout 1500 \
              --full-page \
              http://127.0.0.1:3000/admin/inventory \
              "control-room-screenshots/inventory-grid-${label}.png" 2>&1 | tee -a browser.log

            "$PLAYWRIGHT" screenshot \
              --browser chromium \
              --viewport-size "$viewport" \
              --wait-for-timeout 1500 \
              --full-page \
              http://127.0.0.1:3000/admin/orders \
              "control-room-screenshots/orders-${label}.png" 2>&1 | tee -a browser.log

            "$PLAYWRIGHT" screenshot \
              --browser chromium \
              --viewport-size "$viewport" \
              --wait-for-timeout 1500 \
              --full-page \
              http://127.0.0.1:3000/admin/holds \
              "control-room-screenshots/holds-${label}.png" 2>&1 | tee -a browser.log

            "$PLAYWRIGHT" screenshot \
              --browser chromium \
              --viewport-size "$viewport" \
              --wait-for-timeout 1500 \
              --full-page \
              http://127.0.0.1:3000/admin/returns \
              "control-room-screenshots/returns-${label}.png" 2>&1 | tee -a browser.log

            "$PLAYWRIGHT" screenshot \
              --browser chromium \
              --viewport-size "$viewport" \
              --wait-for-timeout 1500 \
              --full-page \
              http://127.0.0.1:3000/admin/customers \
              "control-room-screenshots/customers-${label}.png" 2>&1 | tee -a browser.log

            "$PLAYWRIGHT" screenshot \
              --browser chromium \
              --viewport-size "$viewport" \
              --wait-for-timeout 1500 \
              --full-page \
              http://127.0.0.1:3000/admin/settings \
              "control-room-screenshots/settings-${label}.png" 2>&1 | tee -a browser.log
          done

          "$PLAYWRIGHT" screenshot \
            --browser chromium \
            --viewport-size "1280,800" \
            --wait-for-timeout 1500 \
            --full-page \
            'http://127.0.0.1:3000/admin/inventory?presentation=table' \
            "control-room-screenshots/inventory-table-1280x800.png" 2>&1 | tee -a browser.log

          for viewport in 375,812 1280,800; do
            label=${viewport/,/x}
            "$PLAYWRIGHT" screenshot \
              --browser chromium \
              --viewport-size "$viewport" \
              --wait-for-timeout 1500 \
              --full-page \
              'http://127.0.0.1:3000/admin/inventory?product=botanical-jeans' \
              "control-room-screenshots/inventory-detail-${label}.png" 2>&1 | tee -a browser.log

            "$PLAYWRIGHT" screenshot \
              --browser chromium \
              --viewport-size "$viewport" \
              --wait-for-timeout 1500 \
              --full-page \
              'http://127.0.0.1:3000/admin/orders?order=LS-20481' \
              "control-room-screenshots/orders-detail-${label}.png" 2>&1 | tee -a browser.log

            "$PLAYWRIGHT" screenshot \
              --browser chromium \
              --viewport-size "$viewport" \
              --wait-for-timeout 1500 \
              --full-page \
              'http://127.0.0.1:3000/admin/holds?hold=hold-botanical' \
              "control-room-screenshots/holds-detail-${label}.png" 2>&1 | tee -a browser.log

            "$PLAYWRIGHT" screenshot \
              --browser chromium \
              --viewport-size "$viewport" \
              --wait-for-timeout 1500 \
              --full-page \
              'http://127.0.0.1:3000/admin/customers?customer=customer-amara' \
              "control-room-screenshots/customers-detail-${label}.png" 2>&1 | tee -a browser.log

            "$PLAYWRIGHT" screenshot \
              --browser chromium \
              --viewport-size "$viewport" \
              --wait-for-timeout 1500 \
              --full-page \
              'http://127.0.0.1:3000/admin/settings?section=team' \
              "control-room-screenshots/settings-team-${label}.png" 2>&1 | tee -a browser.log
          done

          cp scripts/control-room-phase3-check.mjs /tmp/control-room-browser/control-room-phase3-check.mjs
          cp scripts/control-room-phase4-orders-check.mjs /tmp/control-room-browser/control-room-phase4-orders-check.mjs
          cp scripts/control-room-phase4-holds-check.mjs /tmp/control-room-browser/control-room-phase4-holds-check.mjs
          cp scripts/control-room-phase4-sales-returns-check.mjs /tmp/control-room-browser/control-room-phase4-sales-returns-check.mjs
          cp scripts/control-room-phase5-customers-check.mjs /tmp/control-room-browser/control-room-phase5-customers-check.mjs
          cp scripts/control-room-phase6-settings-check.mjs /tmp/control-room-browser/control-room-phase6-settings-check.mjs
          CONTROL_ROOM_BASE_URL=http://127.0.0.1:3000 \
            CONTROL_ROOM_SCREENSHOT_DIR="$GITHUB_WORKSPACE/control-room-screenshots" \
            node /tmp/control-room-browser/control-room-phase3-check.mjs 2>&1 | tee -a browser.log
          CONTROL_ROOM_BASE_URL=http://127.0.0.1:3000 \
            CONTROL_ROOM_SCREENSHOT_DIR="$GITHUB_WORKSPACE/control-room-screenshots" \
            node /tmp/control-room-browser/control-room-phase4-orders-check.mjs 2>&1 | tee -a browser.log
          CONTROL_ROOM_BASE_URL=http://127.0.0.1:3000 \
            CONTROL_ROOM_SCREENSHOT_DIR="$GITHUB_WORKSPACE/control-room-screenshots" \
            node /tmp/control-room-browser/control-room-phase4-holds-check.mjs 2>&1 | tee -a browser.log
          CONTROL_ROOM_BASE_URL=http://127.0.0.1:3000 \
            CONTROL_ROOM_SCREENSHOT_DIR="$GITHUB_WORKSPACE/control-room-screenshots" \
            node /tmp/control-room-browser/control-room-phase4-sales-returns-check.mjs 2>&1 | tee -a browser.log
          CONTROL_ROOM_BASE_URL=http://127.0.0.1:3000 \
            CONTROL_ROOM_SCREENSHOT_DIR="$GITHUB_WORKSPACE/control-room-screenshots" \
            node /tmp/control-room-browser/control-room-phase5-customers-check.mjs 2>&1 | tee -a browser.log
          CONTROL_ROOM_BASE_URL=http://127.0.0.1:3000 \
            CONTROL_ROOM_SCREENSHOT_DIR="$GITHUB_WORKSPACE/control-room-screenshots" \
            node /tmp/control-room-browser/control-room-phase6-settings-check.mjs 2>&1 | tee -a browser.log

          cleanup
          trap - EXIT

      - name: React Doctor diagnostics
        if: always()
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx react-doctor@latest . --verbose --scope changed --base origin/main 2>&1 | tee react-doctor.log
          grep -a -i -q 'No issues found!' react-doctor.log

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-room-v2-logs
          path: |
            lint.log
            typescript.log
            tests.log
            build.log
            browser.log
            react-doctor.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-room-v2-screenshots
          path: control-room-screenshots
          if-no-files-found: warn
          retention-days: 7
