name: Control Room V2 checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee lint.log

      - name: TypeScript
        id: typescript
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsc --noEmit 2>&1 | tee typescript.log

      - name: Tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec vitest run --passWithNoTests 2>&1 | tee tests.log

      - name: Production build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log

      - name: React Doctor diagnostics
        id: react_doctor
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx react-doctor@latest . --verbose --scope changed --base origin/main 2>&1 | tee react-doctor.log

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-room-v2-logs
          path: |
            lint.log
            typescript.log
            tests.log
            build.log
            react-doctor.log
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce required checks
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPESCRIPT_OUTCOME: ${{ steps.typescript.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          printf 'lint=%s\ntypescript=%s\ntests=%s\nbuild=%s\n' \
            "$LINT_OUTCOME" "$TYPESCRIPT_OUTCOME" "$TESTS_OUTCOME" "$BUILD_OUTCOME"
          test "$LINT_OUTCOME" = success
          test "$TYPESCRIPT_OUTCOME" = success
          test "$TESTS_OUTCOME" = success
          test "$BUILD_OUTCOME" = success
