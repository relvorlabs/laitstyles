name: Control Room V2 checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: control-room-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee lint.log

      - name: TypeScript
        id: typescript
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsc --noEmit 2>&1 | tee typescript.log

      - name: Tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec vitest run --passWithNoTests 2>&1 | tee tests.log

      - name: Production build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log

      - name: Browser viewport checks
        id: browser
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p control-room-screenshots
          pnpm dlx playwright@latest install --with-deps chromium 2>&1 | tee browser.log

          ./node_modules/.bin/next start >> browser.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:3000/admin >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:3000/admin >/dev/null
          curl --silent --fail http://127.0.0.1:3000/admin/inventory >/dev/null

          for viewport in 375,812 768,1024 1280,800; do
            label=${viewport/,/x}
            pnpm dlx playwright@latest screenshot \
              --browser chromium \
              --viewport-size "$viewport" \
              --wait-for-timeout 1200 \
              --full-page \
              http://127.0.0.1:3000/admin \
              "control-room-screenshots/active-${label}.png" 2>&1 | tee -a browser.log

            pnpm dlx playwright@latest screenshot \
              --browser chromium \
              --viewport-size "$viewport" \
              --wait-for-timeout 1200 \
              --full-page \
              'http://127.0.0.1:3000/admin?view=new-store' \
              "control-room-screenshots/new-store-${label}.png" 2>&1 | tee -a browser.log

            pnpm dlx playwright@latest screenshot \
              --browser chromium \
              --viewport-size "$viewport" \
              --wait-for-timeout 1500 \
              --full-page \
              http://127.0.0.1:3000/admin/inventory \
              "control-room-screenshots/inventory-grid-${label}.png" 2>&1 | tee -a browser.log
          done

          pnpm dlx playwright@latest screenshot \
            --browser chromium \
            --viewport-size "1280,800" \
            --wait-for-timeout 1500 \
            --full-page \
            'http://127.0.0.1:3000/admin/inventory?presentation=table' \
            "control-room-screenshots/inventory-table-1280x800.png" 2>&1 | tee -a browser.log

          for viewport in 375,812 1280,800; do
            label=${viewport/,/x}
            pnpm dlx playwright@latest screenshot \
              --browser chromium \
              --viewport-size "$viewport" \
              --wait-for-timeout 1500 \
              --full-page \
              'http://127.0.0.1:3000/admin/inventory?product=botanical-jeans' \
              "control-room-screenshots/inventory-detail-${label}.png" 2>&1 | tee -a browser.log
          done

          cleanup
          trap - EXIT
          true

      - name: React Doctor diagnostics
        id: react_doctor
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx react-doctor@latest . --verbose --scope changed --base origin/main 2>&1 | tee react-doctor.log
          grep -a -i -q 'No issues found!' react-doctor.log

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-room-v2-logs
          path: |
            lint.log
            typescript.log
            tests.log
            build.log
            browser.log
            react-doctor.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-room-v2-screenshots
          path: control-room-screenshots
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce required checks
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPESCRIPT_OUTCOME: ${{ steps.typescript.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          REACT_DOCTOR_OUTCOME: ${{ steps.react_doctor.outcome }}
        run: |
          printf 'lint=%s\ntypescript=%s\ntests=%s\nbuild=%s\nbrowser=%s\nreact_doctor=%s\n' \
            "$LINT_OUTCOME" "$TYPESCRIPT_OUTCOME" "$TESTS_OUTCOME" "$BUILD_OUTCOME" "$BROWSER_OUTCOME" "$REACT_DOCTOR_OUTCOME"
          test "$LINT_OUTCOME" = success
          test "$TYPESCRIPT_OUTCOME" = success
          test "$TESTS_OUTCOME" = success
          test "$BUILD_OUTCOME" = success
          test "$BROWSER_OUTCOME" = success
          test "$REACT_DOCTOR_OUTCOME" = success
