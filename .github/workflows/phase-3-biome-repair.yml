name: Phase 3 One-shot Biome Repair

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: phase-3-biome-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.number == 40
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - uses: ./.github/actions/setup-environment
        with:
          node-version: "25"

      - name: Apply and verify repository-safe repairs
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pnpm add @prisma/client-runtime-utils@7.8.0 --save-exact
          pnpm biome:fix > biome-safe-fix.log 2>&1 || true

          cat > src/server/commerce/catalogue/variant-measurements.ts <<'EOF'
          import type { Measurement } from "@/lib/storefront/types";

          export type VariantMeasurementRecord = {
            variant_id: string;
            label: string;
            value: string;
            position: number;
          };

          export function groupVariantMeasurements(
            rows: readonly VariantMeasurementRecord[],
          ): Record<string, Measurement[]> {
            const grouped: Record<string, Measurement[]> = {};
            for (const row of rows) {
              const measurements = grouped[row.variant_id] ?? [];
              measurements.push({
                label: row.label,
                value: row.value,
                position: row.position,
              });
              grouped[row.variant_id] = measurements;
            }
            return grouped;
          }
          EOF

          pnpm exec biome format --write src/server/commerce/catalogue/variant-measurements.ts
          node -e 'const fs=require("node:fs"); const p="scripts/checks/storefront-smoke.ts"; const s=fs.readFileSync(p,"utf8").replace(/[ \t]+$/gm,""); fs.writeFileSync(p,s);'
          pnpm exec biome format --write scripts/checks/storefront-smoke.ts
          pnpm exec biome check . --max-diagnostics=500 > biome-verify.log 2>&1
          git diff --check > diff-check.log 2>&1

      - name: Package repair diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p biome-repair
          cp biome-safe-fix.log biome-repair/ 2>/dev/null || true
          cp biome-verify.log biome-repair/ 2>/dev/null || true
          cp diff-check.log biome-repair/ 2>/dev/null || true
          git diff --binary > biome-repair/repair.patch
          git diff --stat > biome-repair/stat.txt
          git status --short > biome-repair/status.txt

      - name: Upload repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3-biome-repair-diagnostics
          path: biome-repair/
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified repairs and remove this workflow
        if: steps.verify.outcome == 'success'
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          rm .github/workflows/phase-3-biome-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: apply verified Phase 3 validation repairs"
          git push origin "HEAD:${HEAD_REF}"

      - name: Enforce verification result
        if: always()
        shell: bash
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: test "$VERIFY_OUTCOME" = "success"
