name: Phase 3 One-shot Biome Repair

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: phase-3-biome-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.number == 40
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - uses: ./.github/actions/setup-environment
        with:
          node-version: "25"

      - name: Apply and verify repository-safe Biome fixes
        shell: bash
        run: |
          set -euo pipefail
          pnpm biome:fix || true

          cat > src/server/commerce/catalogue/variant-measurements.ts <<'EOF'
          import type { Measurement } from "@/lib/storefront/types";

          export type VariantMeasurementRecord = {
            variant_id: string;
            label: string;
            value: string;
            position: number;
          };

          export function groupVariantMeasurements(
            rows: readonly VariantMeasurementRecord[],
          ): Record<string, Measurement[]> {
            const grouped: Record<string, Measurement[]> = {};
            for (const row of rows) {
              const measurements = grouped[row.variant_id] ?? [];
              measurements.push({
                label: row.label,
                value: row.value,
                position: row.position,
              });
              grouped[row.variant_id] = measurements;
            }
            return grouped;
          }
          EOF

          pnpm biome
          git diff --check

      - name: Commit verified safe fixes and remove this workflow
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          rm .github/workflows/phase-3-biome-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: apply verified Biome safe fixes"
          git push origin "HEAD:${HEAD_REF}"
