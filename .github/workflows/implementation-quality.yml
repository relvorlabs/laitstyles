name: Implementation Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: implementation-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  CI_BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/laitstyles
  DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/laitstyles
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

jobs:
  static:
    name: Static analysis
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","linux","x64","laitstyles-ci"]') }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-environment
        with:
          node-version: "25"

      - name: Run architecture, button, Biome and TypeScript gates
        run: node scripts/ci/run-gates.mjs --suite static --output ci-evidence/static

      - uses: ./.github/actions/upload-evidence
        if: always()
        with:
          name: validation-static
          path: ci-evidence/static/

  tests:
    name: Unit and component tests
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","linux","x64","laitstyles-ci"]') }}
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-environment
        with:
          node-version: "25"

      - name: Run Vitest with coverage
        run: node scripts/ci/run-gates.mjs --suite tests --output ci-evidence/tests

      - uses: ./.github/actions/upload-evidence
        if: always()
        with:
          name: validation-tests
          path: |
            ci-evidence/tests/
            coverage/

  database:
    name: Database integrity
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","linux","x64","laitstyles-ci"]') }}
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: laitstyles
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d laitstyles"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-environment
        with:
          node-version: "25"

      - name: Validate and deploy migrations
        run: node scripts/ci/run-gates.mjs --suite database --output ci-evidence/database

      - uses: ./.github/actions/upload-evidence
        if: always()
        with:
          name: validation-database
          path: ci-evidence/database/

  build:
    name: Production build and React Doctor
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","linux","x64","laitstyles-ci"]') }}
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: laitstyles
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d laitstyles"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-environment
        with:
          node-version: "25"

      - name: Build and run pinned React Doctor
        run: node scripts/ci/run-gates.mjs --suite build --output ci-evidence/build

      - uses: ./.github/actions/upload-evidence
        if: always()
        with:
          name: validation-build
          path: ci-evidence/build/

  aggregate:
    name: Aggregate validation evidence
    if: always() && !cancelled()
    needs: [static, tests, database, build]
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","linux","x64","laitstyles-ci"]') }}
    timeout-minutes: 15
    steps:
      - name: Check out trusted scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"

      - name: Download validation evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: validation-*
          path: ci-artifacts

      - name: Merge manifests and detect missing suites
        run: >-
          node scripts/ci/merge-evidence.mjs
          --input ci-artifacts
          --output ci-feedback
          --expect static,database,tests,build

      - name: Publish aggregate in workflow summary
        run: cat ci-feedback/ci-feedback.md >> "$GITHUB_STEP_SUMMARY"

      - uses: ./.github/actions/upload-evidence
        if: always()
        with:
          name: implementation-quality-feedback
          path: ci-feedback/
