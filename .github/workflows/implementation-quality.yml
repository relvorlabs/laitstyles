name: Implementation Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: implementation-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "1"

  # Required by Prisma generation and application configuration.
  # Only jobs with a Postgres service can actually connect to this URL.
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/laitstyles
  DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/laitstyles

  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-environment
        with:
          node-version: "25"

      - name: Architecture guard
        run: pnpm check:architecture

      - name: Button audit
        run: pnpm audit:buttons

      - name: Biome lint and format check
        run: pnpm lint

      - name: TypeScript type-check
        run: pnpm typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-environment
        with:
          node-version: "25"

      - name: Run Vitest with coverage
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  database:
    name: Database integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: laitstyles
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d laitstyles"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-environment
        with:
          node-version: "25"

      - name: Validate Prisma schema
        run: pnpm prisma:validate

      - name: Apply migrations to a clean database
        run: pnpm prisma:migrate:deploy

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    # The current application performs database reads while building pages.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: laitstyles
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d laitstyles"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-environment
        with:
          node-version: "25"

      - name: Apply migrations required by build-time reads
        run: pnpm prisma:migrate:deploy

      - name: Build production application
        run: pnpm build
