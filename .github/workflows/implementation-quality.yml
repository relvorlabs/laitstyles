name: Implementation Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: implementation-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  STOREFRONT_STYLE_SMOKE: "1"
  CI_BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
  PR_NUMBER: ${{ github.event.pull_request.number || '' }}
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/laitstyles
  DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/laitstyles
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

jobs:
  context:
    name: Implementation context and agent guidance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out application
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load implementation agent skills
        uses: actions/checkout@v4
        with:
          repository: relvorlabs/agent-controller
          path: .ci/agent-controller
          persist-credentials: false
          sparse-checkout: |
            skills/next-best-practices
            skills/vercel-react-best-practices
            skills/error-handling-patterns
            skills/typescript-advanced-types
            skills/react-doctor

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Verify doctrine and loaded skills
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AGENTS.md
            .agents/doctrine/architecture.md
            .agents/doctrine/conventions.md
            .agents/doctrine/server-and-actions.md
            .agents/doctrine/toolchain-and-skills.md
            .agents/doctrine/validation-and-reporting.md
            .ci/agent-controller/skills/next-best-practices/SKILL.md
            .ci/agent-controller/skills/vercel-react-best-practices/SKILL.md
            .ci/agent-controller/skills/error-handling-patterns/SKILL.md
            .ci/agent-controller/skills/typescript-advanced-types/SKILL.md
            .ci/agent-controller/skills/react-doctor/SKILL.md
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing required guidance: $path"; exit 1; }
          done

      - name: Capture changed code, doctrine and skills
        run: node scripts/ci/collect-context.mjs --output ci-evidence/context

      - name: Upload implementation context
        uses: actions/upload-artifact@v4
        with:
          name: implementation-context
          path: ci-evidence/context/
          if-no-files-found: error
          retention-days: 14

  static:
    name: Architecture, conventions and static contracts
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out application
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run static gate suite
        run: node scripts/ci/run-gates.mjs --suite static --output ci-evidence/static
      - name: Upload static evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implementation-static
          path: ci-evidence/static/
          if-no-files-found: error
          retention-days: 14

  database:
    name: Prisma schema and migration integrity
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: laitstyles
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U postgres -d laitstyles"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out application
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run database gate suite
        run: node scripts/ci/run-gates.mjs --suite database --output ci-evidence/database
      - name: Upload database evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implementation-database
          path: ci-evidence/database/
          if-no-files-found: error
          retention-days: 14

  tests:
    name: Vitest and coverage
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: laitstyles
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U postgres -d laitstyles"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out application
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy migrations before integration tests
        run: pnpm prisma:migrate:deploy
      - name: Run test gate suite
        run: node scripts/ci/run-gates.mjs --suite tests --output ci-evidence/tests
      - name: Upload test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implementation-tests
          path: |
            ci-evidence/tests/
            coverage/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Production build and React review
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: laitstyles
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U postgres -d laitstyles"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out application
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy migrations for build-time reads
        run: pnpm prisma:migrate:deploy
      - name: Run build and React review suite
        run: node scripts/ci/run-gates.mjs --suite build --output ci-evidence/build
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implementation-build
          path: ci-evidence/build/
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: Aggregate implementation evidence
    if: always()
    needs: [context, static, database, tests, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download all implementation evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: implementation-*
          path: ci-artifacts
      - name: Merge manifests and detect missing jobs
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/ci/merge-evidence.mjs
          --input ci-artifacts
          --output ci-feedback
          --expect static,database,tests,build
      - name: Publish aggregate in workflow summary
        run: cat ci-feedback/ci-feedback.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload aggregate feedback
        uses: actions/upload-artifact@v4
        with:
          name: implementation-feedback
          path: ci-feedback/
          if-no-files-found: error
          retention-days: 14
