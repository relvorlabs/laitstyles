name: Laitstyle parity checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee lint.log

      - name: TypeScript
        id: typescript
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsc --noEmit 2>&1 | tee typescript.log

      - name: Tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec vitest run --passWithNoTests 2>&1 | tee tests.log

      - name: Production build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log

      - name: Playwright storefront style inheritance
        id: playwright_styles
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec playwright install --with-deps chromium
          pnpm start > playwright-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat playwright-server.log
              exit 1
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3000 >/dev/null
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 pnpm test:styles:e2e 2>&1 | tee playwright-styles.log

      - name: React Doctor diagnostics
        id: react_doctor
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx react-doctor@latest . --verbose 2>&1 | tee react-doctor.log

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laitstyle-parity-logs
          path: |
            lint.log
            typescript.log
            tests.log
            build.log
            playwright-server.log
            playwright-styles.log
            playwright-artifacts/
            react-doctor.log
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce required checks
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPESCRIPT_OUTCOME: ${{ steps.typescript.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright_styles.outcome }}
        run: |
          printf 'lint=%s\ntypescript=%s\ntests=%s\nbuild=%s\nplaywright=%s\n' \
            "$LINT_OUTCOME" "$TYPESCRIPT_OUTCOME" "$TESTS_OUTCOME" "$BUILD_OUTCOME" "$PLAYWRIGHT_OUTCOME"
          test "$LINT_OUTCOME" = success
          test "$TYPESCRIPT_OUTCOME" = success
          test "$TESTS_OUTCOME" = success
          test "$BUILD_OUTCOME" = success
          test "$PLAYWRIGHT_OUTCOME" = success
