name: Laitstyle parity checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: laitstyle-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "1"
      STOREFRONT_STYLE_SMOKE: "1"
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Catalogue boundary tests
        run: pnpm test -- src/lib/boundaries/server-client-boundary.test.ts src/features/storefront/catalogue/catalogue-search-params.test.ts
      - name: Storefront style smoke
        run: pnpm test:styles:e2e
