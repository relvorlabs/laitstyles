name: Phase 3 Finalize Source

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: phase-3-finalize-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.number == 40
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"

      - name: Apply final source repair
        run: node scripts/ci/finalize-phase-3.mjs

      - name: Commit source and guard repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/prisma/client.ts \
            src/lib/boundaries/storefront-state-boundary.test.ts \
            scripts/checks/architecture-guard.mjs
          git status --short
          git commit -m "fix(phase-3): restore final source contract"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
