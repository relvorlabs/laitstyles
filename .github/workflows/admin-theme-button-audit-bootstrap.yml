name: Admin theme and button audit bootstrap

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-theme-button-audit-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate repository map
        run: node scripts/map-admin-theme-buttons.mjs

      - name: Upload repository map
        uses: actions/upload-artifact@v4
        with:
          name: repository-audit-map
          path: |
            docs/repository-audit-map.md
            docs/repository-audit-map.json
          if-no-files-found: error
