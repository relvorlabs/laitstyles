name: Apply button audit migration

on:
  push:
    branches:
      - agent/button-audit-node24

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'apply native button codemod')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/button-audit-node24
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Convert application native buttons
        run: pnpm buttons:migrate

      - name: Generate exhaustive button memory
        run: pnpm buttons:audit

      - name: Verify generated migration diff
        run: |
          git diff --check
          pnpm buttons:audit:check

      - name: Commit generated migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src BUTTONS_MEMORY.md
          git commit -m "refactor: apply native button codemod"
          git push origin HEAD:agent/button-audit-node24
