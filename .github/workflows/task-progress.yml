name: Task Progress and GitHub Agent Feedback

on:
  workflow_run:
    workflows: [Implementation Quality, Playwright UI Contract]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to inspect
        required: true
        type: number
      mode:
        description: GitHub feedback operation
        required: true
        default: analyze
        type: choice
        options: [analyze, rerun-failed, safe-repair-plan]

permissions:
  actions: write
  checks: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: github-agent-feedback-${{ github.event.issue.number || github.event.workflow_run.head_sha || inputs.pull_request }}-${{ inputs.mode || 'event' }}
  cancel-in-progress: true

jobs:
  agent:
    name: GitHub validation feedback and commands
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null &&
        (startsWith(github.event.comment.body, '/ci analyze') ||
         startsWith(github.event.comment.body, '/ci status') ||
         startsWith(github.event.comment.body, '/ci rerun-failed')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve command, authorization and pull request
        id: context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mode="analyze"
          pr_number=""
          head_sha=""

          case "$GITHUB_EVENT_NAME" in
            workflow_run)
              mode="analyze"
              head_sha=$(jq -r '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")
              pr_number=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
              if [ -z "$pr_number" ]; then
                pr_number=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/pulls" --jq '.[0].number // empty')
              fi
              ;;
            issue_comment)
              association=$(jq -r '.comment.author_association' "$GITHUB_EVENT_PATH")
              case "$association" in OWNER|MEMBER|COLLABORATOR) ;; *)
                echo "Only repository owners, members or collaborators may run CI commands."
                exit 1
                ;;
              esac
              pr_number=$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")
              head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.head.sha')
              body=$(jq -r '.comment.body' "$GITHUB_EVENT_PATH")
              case "$body" in
                /ci\ rerun-failed*) mode="rerun-failed" ;;
                *) mode="analyze" ;;
              esac
              ;;
            workflow_dispatch)
              mode='${{ inputs.mode }}'
              pr_number='${{ inputs.pull_request }}'
              head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.head.sha')
              ;;
          esac

          if [ -z "$pr_number" ] || [ -z "$head_sha" ]; then
            echo "No pull request could be associated with this event."
            exit 1
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Rerun latest failed validation workflows
        if: steps.context.outputs.mode == 'rerun-failed'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" > runs.json
          jq -r '
            [.workflow_runs[]
              | select(.name == "Implementation Quality" or .name == "Playwright UI Contract")
              | select(.conclusion != "success")]
            | sort_by(.created_at)
            | reverse
            | unique_by(.name)
            | .[].id
          ' runs.json > run-ids.txt

          if [ ! -s run-ids.txt ]; then
            echo "No failed validation workflow runs exist for ${HEAD_SHA}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          while read -r run_id; do
            [ -n "$run_id" ] || continue
            gh run rerun "$run_id" --failed || gh run rerun "$run_id"
            echo "Rerun requested for workflow run ${run_id}." >> "$GITHUB_STEP_SUMMARY"
          done < run-ids.txt

      - name: Comment rerun status
        if: steps.context.outputs.mode == 'rerun-failed'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        run: >-
          gh pr comment "$PR_NUMBER"
          --body "Requested reruns for the latest failed Implementation Quality and Playwright UI Contract runs on the current PR head."

      - name: Check out trusted feedback scripts
        if: steps.context.outputs.mode == 'analyze'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for feedback
        if: steps.context.outputs.mode == 'analyze'
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Collect runs, jobs, logs, artifacts and PR context
        if: steps.context.outputs.mode == 'analyze'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/meta ci-artifacts/runs
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > ci-artifacts/meta/pull-request.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            | jq '[.[][] | {filename,status,additions,deletions,changes,patch}]' > ci-artifacts/meta/files.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" > ci-artifacts/meta/runs.json

          jq -r '
            [.workflow_runs[]
              | select(.name == "Implementation Quality" or .name == "Playwright UI Contract")]
            | sort_by(.created_at)
            | reverse
            | unique_by(.name)
            | .[].id
          ' ci-artifacts/meta/runs.json > ci-artifacts/meta/run-ids.txt

          while read -r run_id; do
            [ -n "$run_id" ] || continue
            mkdir -p "ci-artifacts/runs/${run_id}"
            gh run view "$run_id" --json name,workflowName,status,conclusion,url,event,headBranch,headSha,createdAt,updatedAt \
              > "ci-artifacts/runs/${run_id}/run.json" || echo '{}' > "ci-artifacts/runs/${run_id}/run.json"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
              > "ci-artifacts/runs/${run_id}/jobs.json" || echo '{"jobs":[]}' > "ci-artifacts/runs/${run_id}/jobs.json"
            gh run view "$run_id" --log-failed > "ci-artifacts/runs/${run_id}/failed.log" 2>&1 || true
            gh run download "$run_id" --dir "ci-artifacts/runs/${run_id}/artifacts" || true

            workflow_name=$(jq -r '.workflowName // .name // "unknown-workflow"' "ci-artifacts/runs/${run_id}/run.json")
            failure_log=$(tail -n 240 "ci-artifacts/runs/${run_id}/failed.log" 2>/dev/null || true)
            jq \
              --arg workflow "$workflow_name" \
              --arg run_id "$run_id" \
              --arg sha "$HEAD_SHA" \
              --arg failure_log "$failure_log" \
              '{
                schemaVersion: 1,
                kind: "workflow-runtime",
                workflow: $workflow,
                runId: $run_id,
                sha: $sha,
                status: (if (.jobs | length) == 0 then "failed" elif any(.jobs[]; .conclusion != "success") then "failed" else "passed" end),
                results: (
                  if (.jobs | length) == 0 then [{
                    name: "workflow-job-allocation",
                    required: true,
                    status: "failed",
                    exitCode: null,
                    timedOut: false,
                    failureTail: "GitHub returned no jobs for this workflow run. The workflow is not validated."
                  }]
                  else [.jobs[] | {
                    name,
                    required: true,
                    status: (if .conclusion == "success" then "passed" elif .conclusion == "skipped" or .conclusion == "neutral" then "warning" else "failed" end),
                    exitCode: null,
                    timedOut: (.conclusion == "timed_out"),
                    failureTail: (
                      if .steps == null then
                        "Job ended before GitHub allocated executable steps or logs. This is a runner/infrastructure failure, not a passed code check."
                      elif .conclusion != "success" then $failure_log
                      else null end
                    )
                  }]
                  end
                )
              }' "ci-artifacts/runs/${run_id}/jobs.json" > "ci-artifacts/runs/${run_id}/manifest.json"
          done < ci-artifacts/meta/run-ids.txt

          jq -n \
            --slurpfile pr ci-artifacts/meta/pull-request.json \
            --slurpfile files ci-artifacts/meta/files.json \
            --arg sha "$HEAD_SHA" \
            '{
              schemaVersion: 1,
              kind: "remote-pr-context",
              repository: env.GITHUB_REPOSITORY,
              pullRequest: ($pr[0].number),
              sha: $sha,
              title: ($pr[0].title),
              body: ($pr[0].body // ""),
              baseRef: ($pr[0].base.ref),
              branch: ($pr[0].head.ref),
              changedFiles: [$files[0][].filename],
              diffStat: ($files[0] | map("\(.filename): +\(.additions) -\(.deletions)") | join("\n")),
              patch: ($files[0] | map(select(.patch != null) | "diff -- \(.filename)\n\(.patch)") | join("\n\n"))
            }' > ci-artifacts/meta/context.json

      - name: Merge execution evidence
        if: steps.context.outputs.mode == 'analyze'
        env:
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
        run: >-
          node scripts/ci/merge-evidence.mjs
          --input ci-artifacts
          --output ci-feedback
          --expect static,database,tests,build,browser-preflight,playwright:desktop-chromium,playwright:tablet-chromium,playwright:mobile-chromium

      - name: Build keyless GitHub agent handoff
        if: steps.context.outputs.mode == 'analyze'
        run: >-
          node scripts/ci/build-agent-handoff.mjs
          --feedback ci-feedback/ci-feedback.json
          --context ci-artifacts/meta/context.json
          --output ci-feedback

      - name: Publish sticky pull-request feedback
        if: steps.context.outputs.mode == 'analyze'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        run: >-
          node scripts/ci/publish-feedback.mjs
          --pull-request "$PR_NUMBER"
          --feedback ci-feedback/ci-feedback.md
          --handoff ci-feedback/agent-handoff.md

      - name: Add feedback to workflow summary
        if: steps.context.outputs.mode == 'analyze'
        run: |
          cat ci-feedback/ci-feedback.md >> "$GITHUB_STEP_SUMMARY"
          cat ci-feedback/agent-handoff.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload consolidated runtime feedback
        if: always() && steps.context.outputs.mode == 'analyze'
        uses: actions/upload-artifact@v4
        with:
          name: task-runtime-feedback-${{ steps.context.outputs.pr_number }}
          path: |
            ci-feedback/
            ci-artifacts/meta/
            ci-artifacts/runs/*/run.json
            ci-artifacts/runs/*/jobs.json
            ci-artifacts/runs/*/failed.log
          if-no-files-found: warn
          retention-days: 14

      - name: Check out pull-request head for deterministic repair
        if: steps.context.outputs.mode == 'safe-repair-plan'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm for deterministic repair
        if: steps.context.outputs.mode == 'safe-repair-plan'
        uses: pnpm/action-setup@v4
      - name: Set up Node.js for deterministic repair
        if: steps.context.outputs.mode == 'safe-repair-plan'
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - name: Install dependencies without lifecycle scripts
        if: steps.context.outputs.mode == 'safe-repair-plan'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run deterministic safe formatter repair
        if: steps.context.outputs.mode == 'safe-repair-plan'
        continue-on-error: true
        run: node scripts/ci/run-gates.mjs --suite safe-repair --output ci-repair/evidence
      - name: Produce reviewable repair patch
        if: steps.context.outputs.mode == 'safe-repair-plan'
        shell: bash
        run: |
          mkdir -p ci-repair
          git diff --binary > ci-repair/safe-repair.patch
          git diff --stat > ci-repair/safe-repair.stat
          if [ ! -s ci-repair/safe-repair.patch ]; then
            echo 'No deterministic formatting changes were available.' > ci-repair/README.txt
          fi
      - name: Upload repair plan
        if: steps.context.outputs.mode == 'safe-repair-plan'
        uses: actions/upload-artifact@v4
        with:
          name: safe-repair-plan-pr-${{ steps.context.outputs.pr_number }}
          path: ci-repair/
          if-no-files-found: error
          retention-days: 14
      - name: Comment repair-plan location
        if: steps.context.outputs.mode == 'safe-repair-plan'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        run: >-
          gh pr comment "$PR_NUMBER"
          --body "A deterministic Biome repair patch was generated as the **safe-repair-plan-pr-${PR_NUMBER}** workflow artifact. It was not pushed automatically."
