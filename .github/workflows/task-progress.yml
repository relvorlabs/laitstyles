name: Task Progress and Runtime Feedback

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  workflow_run:
    workflows: [Implementation Quality, Playwright UI Contract]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to inspect
        required: true
        type: number
      mode:
        description: Feedback operation
        required: true
        default: analyze
        type: choice
        options: [analyze, safe-repair-plan]

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: task-feedback-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || inputs.pull_request }}-${{ inputs.mode || 'analyze' }}
  cancel-in-progress: true

jobs:
  feedback:
    name: Aggregate logs and publish actionable feedback
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'analyze'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Resolve pull request and head commit
        id: context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number=""
          head_sha=""
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              pr_number=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
              head_sha=$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
              ;;
            workflow_run)
              head_sha=$(jq -r '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")
              pr_number=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
              if [ -z "$pr_number" ]; then
                pr_number=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/pulls" --jq '.[0].number // empty')
              fi
              ;;
            workflow_dispatch)
              pr_number='${{ inputs.pull_request }}'
              head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.head.sha')
              ;;
          esac
          if [ -z "$pr_number" ] || [ -z "$head_sha" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No pull request could be associated with this event." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Check out trusted feedback scripts
        if: steps.context.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && steps.context.outputs.head_sha || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        if: steps.context.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Collect workflow runs, jobs, failed logs and artifacts
        if: steps.context.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/meta ci-artifacts/runs
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > ci-artifacts/meta/pull-request.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            | jq '[.[][] | {filename,status,additions,deletions,changes,patch}]' > ci-artifacts/meta/files.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" > ci-artifacts/meta/runs.json

          jq -r '
            [.workflow_runs[]
              | select(.name == "Implementation Quality" or .name == "Playwright UI Contract")]
            | sort_by(.created_at)
            | reverse
            | unique_by(.name)
            | .[].id
          ' ci-artifacts/meta/runs.json > ci-artifacts/meta/run-ids.txt

          while read -r run_id; do
            [ -n "$run_id" ] || continue
            mkdir -p "ci-artifacts/runs/${run_id}"
            gh run view "$run_id" --json name,workflowName,status,conclusion,url,event,headBranch,headSha,createdAt,updatedAt \
              > "ci-artifacts/runs/${run_id}/run.json" || true
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
              > "ci-artifacts/runs/${run_id}/jobs.json" || echo '{"jobs":[]}' > "ci-artifacts/runs/${run_id}/jobs.json"
            gh run view "$run_id" --log-failed > "ci-artifacts/runs/${run_id}/failed.log" 2>&1 || true
            gh run download "$run_id" --dir "ci-artifacts/runs/${run_id}/artifacts" || true

            workflow_name=$(jq -r '.workflowName // .name // "unknown-workflow"' "ci-artifacts/runs/${run_id}/run.json")
            jq \
              --arg workflow "$workflow_name" \
              --arg run_id "$run_id" \
              --arg sha "$HEAD_SHA" \
              '{
                schemaVersion: 1,
                kind: "workflow-runtime",
                workflow: $workflow,
                runId: $run_id,
                sha: $sha,
                status: (if any(.jobs[]; .conclusion != "success") then "failed" else "passed" end),
                results: [.jobs[] | {
                  name,
                  required: true,
                  status: (if .conclusion == "success" then "passed" elif .conclusion == "skipped" or .conclusion == "neutral" then "warning" else "failed" end),
                  exitCode: null,
                  timedOut: (.conclusion == "timed_out"),
                  failureTail: (if .steps == null then "Job ended before GitHub allocated executable steps or logs. This is a runner/infrastructure failure, not a passed code check." else null end)
                }]
              }' "ci-artifacts/runs/${run_id}/jobs.json" > "ci-artifacts/runs/${run_id}/manifest.json"
          done < ci-artifacts/meta/run-ids.txt

          jq -n \
            --slurpfile pr ci-artifacts/meta/pull-request.json \
            --slurpfile files ci-artifacts/meta/files.json \
            --arg sha "$HEAD_SHA" \
            '{
              schemaVersion: 1,
              kind: "remote-pr-context",
              repository: env.GITHUB_REPOSITORY,
              pullRequest: ($pr[0].number),
              sha: $sha,
              title: ($pr[0].title),
              body: ($pr[0].body // ""),
              baseRef: ($pr[0].base.ref),
              branch: ($pr[0].head.ref),
              changedFiles: [$files[0][].filename],
              diffStat: ($files[0] | map("\(.filename): +\(.additions) -\(.deletions)") | join("\n")),
              patch: ($files[0] | map(select(.patch != null) | "diff -- \(.filename)\n\(.patch)") | join("\n\n"))
            }' > ci-artifacts/meta/context.json

      - name: Merge execution evidence
        if: steps.context.outputs.skip != 'true'
        env:
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
        run: >-
          node scripts/ci/merge-evidence.mjs
          --input ci-artifacts
          --output ci-feedback
          --expect static,database,tests,build,browser-preflight,playwright:desktop-chromium,playwright:tablet-chromium,playwright:mobile-chromium

      - name: Request optional AI diagnosis
        if: steps.context.outputs.skip != 'true' && github.event_name != 'pull_request'
        env:
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          CI_FEEDBACK_ENDPOINT: ${{ secrets.CI_FEEDBACK_ENDPOINT }}
          CI_FEEDBACK_TOKEN: ${{ secrets.CI_FEEDBACK_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_CI_MODEL: ${{ secrets.OPENAI_CI_MODEL }}
          CI_AI_INCLUDE_PATCH: ${{ vars.CI_AI_INCLUDE_PATCH || 'false' }}
        run: >-
          node scripts/ci/analyze-failures.mjs
          --input ci-feedback/ci-feedback.json
          --context ci-artifacts/meta/context.json
          --output ci-feedback

      - name: Write non-secret analysis status
        if: steps.context.outputs.skip != 'true' && github.event_name == 'pull_request'
        run: |
          printf '%s\n' \
            '## AI failure analysis' \
            '' \
            'Deferred until a trusted workflow-run or manual-dispatch event; pull-request code never receives AI or endpoint secrets.' \
            > ci-feedback/ai-analysis.md

      - name: Publish sticky pull-request feedback
        if: steps.context.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        run: >-
          node scripts/ci/publish-feedback.mjs
          --pull-request "$PR_NUMBER"
          --feedback ci-feedback/ci-feedback.md
          --analysis ci-feedback/ai-analysis.md

      - name: Add feedback to workflow summary
        if: steps.context.outputs.skip != 'true'
        run: |
          cat ci-feedback/ci-feedback.md >> "$GITHUB_STEP_SUMMARY"
          [ ! -f ci-feedback/ai-analysis.md ] || cat ci-feedback/ai-analysis.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload consolidated runtime feedback
        if: always() && steps.context.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: task-runtime-feedback-${{ steps.context.outputs.pr_number }}
          path: |
            ci-feedback/
            ci-artifacts/meta/
            ci-artifacts/runs/*/run.json
            ci-artifacts/runs/*/jobs.json
            ci-artifacts/runs/*/failed.log
          if-no-files-found: warn
          retention-days: 14

  safe-repair-plan:
    name: Generate deterministic repair patch
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'safe-repair-plan'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Resolve requested pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr='${{ inputs.pull_request }}'
          head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.head.sha')
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Check out pull-request head without write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run deterministic safe formatter repair
        continue-on-error: true
        run: node scripts/ci/run-gates.mjs --suite safe-repair --output ci-repair/evidence
      - name: Produce reviewable patch artifact
        shell: bash
        run: |
          mkdir -p ci-repair
          git diff --binary > ci-repair/safe-repair.patch
          git diff --stat > ci-repair/safe-repair.stat
          if [ ! -s ci-repair/safe-repair.patch ]; then echo 'No deterministic formatting changes were available.' > ci-repair/README.txt; fi
      - name: Upload repair plan
        uses: actions/upload-artifact@v4
        with:
          name: safe-repair-plan-pr-${{ steps.pr.outputs.number }}
          path: ci-repair/
          if-no-files-found: error
          retention-days: 14
      - name: Comment repair-plan location
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: >-
          gh pr comment "$PR_NUMBER"
          --body "A deterministic Biome repair patch was generated as the **safe-repair-plan-pr-${PR_NUMBER}** workflow artifact. It was not pushed automatically; review and apply it through a connected coding session. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
