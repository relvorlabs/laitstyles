name: Task Progress Tracker

on:
  pull_request:
    branches:
      - main
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  workflow_run:
    workflows:
      - Playwright UI Contract
      - Implementation Quality
    types:
      - completed
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to inspect
        required: true
        type: number

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: task-progress-${{ github.event.pull_request.number || github.event.workflow_run.id || inputs.pull_request }}
  cancel-in-progress: true

jobs:
  track:
    name: Current task alignment and progress
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve pull request context
        id: context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number=""
          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              pr_number=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
              ;;
            workflow_run)
              pr_number=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
              ;;
            workflow_dispatch)
              pr_number='${{ inputs.pull_request }}'
              ;;
          esac

          if [ -z "$pr_number" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No pull request is associated with this run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          pr_json=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")
          head_sha=$(jq -r '.head.sha' <<< "$pr_json")
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"

      - name: Check out task head
        if: steps.context.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.head_sha }}
          fetch-depth: 0

      - name: Build and publish sticky progress report
        id: report
        if: steps.context.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
        run: |
          set -euo pipefail
          marker='<!-- laitstyles-task-progress -->'
          pr_json=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          title=$(jq -r '.title' <<< "$pr_json")
          body=$(jq -r '.body // ""' <<< "$pr_json")
          state=$(jq -r '.state' <<< "$pr_json")
          draft=$(jq -r '.draft' <<< "$pr_json")
          merged=$(jq -r '.merged' <<< "$pr_json")
          base=$(jq -r '.base.ref' <<< "$pr_json")
          branch=$(jq -r '.head.ref' <<< "$pr_json")

          mapfile -t files < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename')
          checks_json=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100")

          phase=$(printf '%s\n%s' "$title" "$body" | grep -oEi 'phase[[:space:]]+[0-9]+' | head -1 || true)
          phase=${phase:-"Unspecified phase"}
          issue=$(printf '%s' "$body" | grep -oE '#[0-9]+' | head -1 || true)
          issue=${issue:-"No linked issue detected"}
          completed=$(printf '%s' "$body" | grep -Eic -- '- \[[xX]\]' || true)
          remaining=$(printf '%s' "$body" | grep -Ec -- '- \[ \]' || true)

          expected_workflows=(implementation-quality.yml playwright.yml task-progress.yml)
          mapfile -t actual_workflows < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -printf '%f\n' | sort)
          workflow_alignment=true
          if [ "${actual_workflows[*]}" != "${expected_workflows[*]}" ]; then
            workflow_alignment=false
          fi

          scope_alignment=true
          scope_notes=()
          if [[ "${phase,,}" == "phase 3"* ]]; then
            protected_pattern='^(src/features/storefront/|src/features/storefront/shell/site-(header|footer)\.tsx$|src/features/storefront/catalogue/product-card\.tsx$|src/features/storefront/product/|src/app/\(home\)/|src/app/products/|src/components/shop/)'
            for file in "${files[@]}"; do
              if [[ "$file" =~ $protected_pattern ]]; then
                scope_alignment=false
                scope_notes+=("Protected storefront path changed: \`$file\`")
              fi
            done
          fi
          if [ "$workflow_alignment" != true ]; then
            scope_alignment=false
            scope_notes+=("Workflow contract drift: expected exactly implementation-quality.yml, playwright.yml and task-progress.yml")
          fi
          if [ ${#scope_notes[@]} -eq 0 ]; then
            scope_notes+=("No declared phase-boundary drift detected")
          fi

          report=$(mktemp)
          {
            echo "$marker"
            echo "## Temporary task progress tracker"
            echo
            echo "| Field | Current value |"
            echo "| --- | --- |"
            echo "| Task | ${title} |"
            echo "| Phase | ${phase} |"
            echo "| Linked issue | ${issue} |"
            echo "| Branch | \`${branch}\` → \`${base}\` |"
            echo "| Head | \`${HEAD_SHA}\` |"
            echo "| PR state | ${state}; draft=${draft}; merged=${merged} |"
            echo "| Checklist | ${completed} complete / ${remaining} remaining |"
            echo "| Changed files | ${#files[@]} |"
            echo
            echo "### Alignment"
            for note in "${scope_notes[@]}"; do echo "- ${note}"; done
            echo
            echo "### GitHub Actions"
            jq -r '
              [.check_runs[]
                | select(.name != "Current task alignment and progress")
                | "- " + (if .conclusion == "success" then "✅" elif .conclusion == "failure" then "❌" elif .conclusion == "cancelled" then "⚪" else "⏳" end)
                  + " " + .name + " — " + (.conclusion // .status)]
              | unique[]?
            ' <<< "$checks_json"
            if [ "$(jq '[.check_runs[] | select(.name != "Current task alignment and progress")] | length' <<< "$checks_json")" -eq 0 ]; then
              echo "- ⏳ No implementation or browser check has reported yet"
            fi
            echo
            echo "### Changed-file sample"
            printf '%s\n' "${files[@]}" | head -20 | sed 's/^/- `/' | sed 's/$/`/'
            if [ ${#files[@]} -gt 20 ]; then echo "- … and $((${#files[@]} - 20)) more"; fi
            echo
            echo "This comment is maintained automatically and is intentionally temporary for the active task."
          } > "$report"

          comment_id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -1 || true)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --raw-field body="$(cat "$report")" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --raw-field body="$(cat "$report")" >/dev/null
          fi

          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          echo "aligned=${scope_alignment}" >> "$GITHUB_OUTPUT"

      - name: Enforce declared task alignment
        if: steps.context.outputs.skip != 'true' && steps.report.outputs.aligned != 'true'
        run: |
          echo "The changed files or workflow set drifted from the declared task boundary."
          exit 1
