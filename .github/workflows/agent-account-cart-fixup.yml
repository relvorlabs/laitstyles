name: Agent account cart checkout fixup

on:
  push:
    paths:
      - .github/workflows/agent-account-cart-fixup.yml

permissions:
  contents: write

jobs:
  fixup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed source fixups
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path('.')

          def replace(path: str, old: str, new: str, *, required: bool = True) -> None:
              file = root / path
              text = file.read_text()
              count = text.count(old)
              if required and count == 0:
                  raise SystemExit(f"Required source pattern was not found in {path}: {old[:100]!r}")
              if count:
                  file.write_text(text.replace(old, new))
                  print(f"patched {path}: {count} replacement(s)")

          # Reviewer correction: repair the malformed conditional spread.
          replace(
              'src/modules/checkout/server/create-checkout.ts',
              'return new ExpectedCheckoutError({ code, message, ...(field ? { field }) : {} });',
              'return new ExpectedCheckoutError({ code, message, ...(field ? { field } : {}) });',
          )

          # Authenticated cart synchronization must not produce an unhandled rejection.
          replace(
              'src/providers/storefront-state-hydrator.tsx',
              '''      void replaceOwnedCart.mutateAsync(input).then((snapshot) => {
        lastSyncedSignature.current = snapshotSignature(snapshot.lines);
      });''',
              '''      void replaceOwnedCart
        .mutateAsync(input)
        .then((snapshot) => {
          lastSyncedSignature.current = snapshotSignature(snapshot.lines);
        })
        .catch(() => undefined);''',
          )
          replace(
              'src/providers/storefront-state-hydrator.tsx',
              '''  const activeCheckout = checkoutContext.data?.activeCheckout ?? null;

  if (activeCheckout && dismissedCheckoutId !== activeCheckout.checkoutId) {''',
              '''  const activeCheckout = checkoutContext.data?.activeCheckout ?? null;

  if (!signedIn) return <StorefrontHoldAlertRuntime />;

  if (activeCheckout && dismissedCheckoutId !== activeCheckout.checkoutId) {''',
          )

          # Hold and checkout reminders must reopen the real cart/checkout sheet, not a dead route.
          replace(
              'src/modules/storefront-shell/ui/storefront-feedback.tsx',
              'import Link from "next/link";\n',
              '',
          )
          replace(
              'src/modules/storefront-shell/ui/storefront-feedback.tsx',
              '''export function StorefrontHoldAlert({
  count,
  onDismiss,
  secondsLeft,
}: {
  count: number;
  onDismiss: () => void;
  secondsLeft: number;
}) {''',
              '''export function StorefrontHoldAlert({
  count,
  onCheckout,
  onDismiss,
  secondsLeft,
}: {
  count: number;
  onCheckout: () => void;
  onDismiss: () => void;
  secondsLeft: number;
}) {''',
          )
          replace(
              'src/modules/storefront-shell/ui/storefront-feedback.tsx',
              '''        <Button
          size="lg"
          className="shrink-0"
          nativeButton={false}
          render={<Link href="/checkout" />}
        >
          Checkout
        </Button>''',
              '''        <Button className="shrink-0" onClick={onCheckout} size="lg" type="button">
          Checkout
        </Button>''',
          )
          replace(
              'src/providers/storefront-state-hydrator.tsx',
              '''    <StorefrontHoldAlert
      count={seconds.length}
      onDismiss={dismiss}
      secondsLeft={Math.min(...seconds)}
    />''',
              '''    <StorefrontHoldAlert
      count={seconds.length}
      onCheckout={requestStorefrontCheckoutResume}
      onDismiss={dismiss}
      secondsLeft={Math.min(...seconds)}
    />''',
          )

          # A persisted checkout is independently resumable even when the local cart is empty.
          replace(
              'src/modules/checkout/ui/storefront/checkout-sheet.tsx',
              '''  const couponValidation = couponCode.trim() ? couponQuery.data ?? null : null;
  const discountMinor = couponValidation?.valid ? couponValidation.discountMinor : 0;
  const totalMinor = Math.max(0, subtotalMinor + (selectedZone?.feeMinor ?? 0) - discountMinor);
  const phoneReady = Boolean(context && !context.phoneRequired && context.profile.phone.trim());
  const couponReady =
    !couponCode.trim() ||
    (debouncedCouponCode.trim() === couponCode.trim() &&
      !couponQuery.isFetching &&
      couponValidation?.valid === true);
  const canPay = Boolean(
    signedIn &&
      phoneReady &&
      selectedAddressId &&
      selectedZoneId &&
      lines.length > 0 &&
      couponReady &&
      paymentStage === "ready",
  );''',
              '''  const couponValidation = couponCode.trim() ? couponQuery.data ?? null : null;
  const discountMinor = couponValidation?.valid ? couponValidation.discountMinor : 0;
  const displaySubtotalMinor = activeCheckout?.subtotalMinor ?? subtotalMinor;
  const displayDeliveryFeeMinor = activeCheckout?.deliveryFeeMinor ?? selectedZone?.feeMinor ?? 0;
  const displayDiscountMinor = activeCheckout?.discountMinor ?? discountMinor;
  const totalMinor =
    activeCheckout?.totalMinor ??
    Math.max(0, subtotalMinor + (selectedZone?.feeMinor ?? 0) - discountMinor);
  const phoneReady = Boolean(context && !context.phoneRequired && context.profile.phone.trim());
  const couponReady =
    !couponCode.trim() ||
    (debouncedCouponCode.trim() === couponCode.trim() &&
      !couponQuery.isFetching &&
      couponValidation?.valid === true);
  const canResume = Boolean(activeCheckout?.accessCode && paymentStage === "ready");
  const canPay =
    canResume ||
    Boolean(
      !activeCheckout &&
        signedIn &&
        phoneReady &&
        selectedAddressId &&
        selectedZoneId &&
        lines.length > 0 &&
        couponReady &&
        paymentStage === "ready",
    );''',
          )
          replace(
              'src/modules/checkout/ui/storefront/checkout-sheet.tsx',
              '<span>{formatNaira(subtotalMinor)}</span>',
              '<span>{formatNaira(displaySubtotalMinor)}</span>',
          )
          replace(
              'src/modules/checkout/ui/storefront/checkout-sheet.tsx',
              '<span>{selectedZone ? formatNaira(selectedZone.feeMinor) : "—"}</span>',
              '<span>{displayDeliveryFeeMinor > 0 ? formatNaira(displayDeliveryFeeMinor) : "—"}</span>',
          )
          replace(
              'src/modules/checkout/ui/storefront/checkout-sheet.tsx',
              '''          {discountMinor > 0 ? (
            <div className="flex justify-between gap-4 text-emerald-700">
              <span>Coupon {couponValidation?.code}</span>
              <span>−{formatNaira(discountMinor)}</span>
            </div>
          ) : null}''',
              '''          {displayDiscountMinor > 0 ? (
            <div className="flex justify-between gap-4 text-emerald-700">
              <span>{activeCheckout ? "Discount" : `Coupon ${couponValidation?.code ?? ""}`}</span>
              <span>−{formatNaira(displayDiscountMinor)}</span>
            </div>
          ) : null}''',
          )

          # Server settlement is the authoritative point for clearing a paid customer's cart.
          replace(
              'src/modules/checkout/server/settle-payment.ts',
              '''          await recordSuccessfulOrderPayment(tx, {
            orderId: order.id,
            paymentId: payment.id,
            amountMinor: parsed.data.amountMinor,
            currency: parsed.data.currency,
            event: parsed.data,
          });
          return ok({''',
              '''          await recordSuccessfulOrderPayment(tx, {
            orderId: order.id,
            paymentId: payment.id,
            amountMinor: parsed.data.amountMinor,
            currency: parsed.data.currency,
            event: parsed.data,
          });
          if (order.customer_id) {
            await tx.$executeRaw`
              DELETE FROM public.customer_cart_lines
              WHERE customer_id = ${order.customer_id}::uuid
            `;
          }
          return ok({''',
          )

          # Mechanically cut active account ownership over to modules while preserving structure.
          legacy = root / 'src/features/storefront/account'
          target = root / 'src/modules/customers/ui/account'
          if target.exists():
              shutil.rmtree(target)
          shutil.copytree(legacy, target)

          for file in target.rglob('*'):
              if file.suffix not in {'.ts', '.tsx'}:
                  continue
              text = file.read_text()
              text = text.replace(
                  '@/features/storefront/account',
                  '@/modules/customers/ui/account',
              )
              file.write_text(text)

          account_routes = root / 'src/app/(storefront)/account'
          for file in account_routes.rglob('*'):
              if file.suffix not in {'.ts', '.tsx'}:
                  continue
              text = file.read_text().replace(
                  '@/features/storefront/account',
                  '@/modules/customers/ui/account',
              )
              file.write_text(text)

          # Changed storefront consumers prefer the admin-selected cover/default image.
          default_media_files = [
              'src/modules/customers/ui/account/components/account-garments.tsx',
              'src/app/(storefront)/products/[slug]/page.tsx',
              'src/app/(storefront)/cart/page.tsx',
              'src/features/storefront/home/components/one-of-one-card.tsx',
              'src/features/storefront/home/sections/hero-section.tsx',
              'src/modules/auth/ui/auth-dialog.tsx',
              'src/modules/storefront-shell/ui/saved-items-drawer.tsx',
              'src/modules/products/ui/storefront/product-card.tsx',
              'src/modules/products/ui/storefront/overlays/search-overlay.tsx',
              'src/modules/products/ui/storefront/product-detail-sections.tsx',
          ]
          pattern = re.compile(r'\b([A-Za-z_$][\w$]*)\.images\[0\]')
          for relative in default_media_files:
              file = root / relative
              if not file.exists():
                  continue
              text = file.read_text()
              next_text = pattern.sub(r'(\1.defaultImage ?? \1.images[0])', text)
              if next_text != text:
                  file.write_text(next_text)
                  print(f'patched default media access: {relative}')

          # This workflow is intentionally one-run and removes itself from the result commit.
          (root / '.github/workflows/agent-account-cart-fixup.yml').unlink()
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: pnpm

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run reviewer gates and collect evidence
        id: gates
        shell: bash
        run: |
          set +e
          mkdir -p ci-evidence/account-cart-checkout-cutover
          report=ci-evidence/account-cart-checkout-cutover/fixup-gates.txt
          : > "$report"

          run_gate() {
            name="$1"
            shift
            echo "===== $name =====" | tee -a "$report"
            "$@" 2>&1 | tee -a "$report"
            code=${PIPESTATUS[0]}
            echo "exit_code=$code" | tee -a "$report"
            echo | tee -a "$report"
            return 0
          }

          run_gate prisma-generate pnpm prisma:generate
          run_gate prisma-validate pnpm prisma:validate
          run_gate architecture pnpm check:architecture
          run_gate biome pnpm biome
          run_gate typecheck pnpm typecheck
          run_gate unit pnpm test:unit
          run_gate build pnpm build

          echo "===== residual account legacy imports =====" | tee -a "$report"
          grep -RIn '@/features/storefront/account' 'src/app/(storefront)/account' 'src/modules/customers/ui/account' 2>&1 | tee -a "$report" || true
          echo | tee -a "$report"
          echo "===== residual account image primitives =====" | tee -a "$report"
          grep -RInE '<img|from ["'"']next/image["'"']' 'src/modules/customers/ui/account' 2>&1 | tee -a "$report" || true
          echo | tee -a "$report"
          echo "===== residual direct first-image access =====" | tee -a "$report"
          grep -RIn 'images\[0\]' 'src/modules/customers/ui/account' 'src/modules/storefront-shell' 'src/modules/products/ui/storefront' 2>&1 | tee -a "$report" || true

      - name: Commit fixup and evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(storefront): complete account cart checkout cutover"
          git push origin "HEAD:${GITHUB_REF_NAME}"
