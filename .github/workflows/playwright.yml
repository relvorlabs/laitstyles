name: Playwright UI Contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/app/**"
      - "src/components/**"
      - "src/features/storefront/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/actions/setup-environment/**"
      - ".github/workflows/playwright.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  homepage:
    name: Homepage UI / responsive, theme and actions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      DATABASE_URL: ${{ secrets.PLAYWRIGHT_DATABASE_URL || secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.PLAYWRIGHT_DIRECT_URL || secrets.DIRECT_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PLAYWRIGHT_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PLAYWRIGHT_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Check out PR source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up project
        uses: ./.github/actions/setup-environment
        with:
          node-version: "25"

      - name: Validate Supabase test environment
        shell: bash
        run: |
          set -euo pipefail
          required=(
            DATABASE_URL
            DIRECT_URL
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
          )

          for variable in "${required[@]}"; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::$variable is missing. Configure it as a repository secret or its PLAYWRIGHT_ equivalent."
              exit 1
            fi
          done

      - name: Build exact PR application
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run homepage Playwright contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results

          pnpm start > test-results/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..120}; do
            if curl --fail --silent --show-error "$PLAYWRIGHT_BASE_URL/" >/dev/null; then
              break
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "The production server exited before the homepage became ready."
              cat test-results/server.log
              exit 1
            fi

            if [ "$attempt" -eq 120 ]; then
              echo "The homepage did not become ready."
              cat test-results/server.log
              exit 1
            fi

            sleep 1
          done

          pnpm test:e2e -- tests/e2e/homepage-ui.spec.ts \
            --project=desktop-chromium \
            --project=tablet-chromium \
            --project=mobile-chromium

      - name: Print server log after failure
        if: failure()
        run: cat test-results/server.log || true

      - name: Upload Playwright report and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-homepage-${{ github.event.pull_request.number || github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
