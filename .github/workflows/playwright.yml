name: Playwright

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "1"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/laitstyles
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/laitstyles
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit raw application buttons
        run: pnpm audit:buttons

      - name: Install Chromium and operating-system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Start local Supabase auth stub
        shell: bash
        run: |
          node --input-type=module <<'NODE' > supabase-mock.log 2>&1 &
          import http from "node:http";

          http
            .createServer((request, response) => {
              response.setHeader("content-type", "application/json");
              if (request.url?.includes("/.well-known/jwks.json")) {
                response.writeHead(200);
                response.end(JSON.stringify({ keys: [] }));
                return;
              }
              if (request.url?.includes("/auth/v1/user")) {
                response.writeHead(401);
                response.end(JSON.stringify({ message: "No authorization header" }));
                return;
              }
              response.writeHead(200);
              response.end(JSON.stringify({}));
            })
            .listen(54321, "127.0.0.1");
          NODE
          echo $! > supabase-mock.pid

      - name: Build production application
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee playwright-build.log

      - name: Run Playwright suite
        shell: bash
        run: |
          set -o pipefail
          pnpm start > playwright-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat playwright-server.log
              exit 1
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3000 >/dev/null
          pnpm test:e2e 2>&1 | tee playwright-tests.log

      - name: Upload Playwright report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            playwright-build.log
            playwright-server.log
            playwright-tests.log
            supabase-mock.log
          if-no-files-found: warn
          retention-days: 14
