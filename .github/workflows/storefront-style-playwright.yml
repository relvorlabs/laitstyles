name: Storefront style Playwright

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-storefront-styles:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: laitstyles
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d laitstyles"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/laitstyles
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/laitstyles
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Prepare storefront database
        run: |
          pnpm exec prisma db push --skip-generate --accept-data-loss
          pnpm db:seed:storefront

      - name: Start local Supabase auth stub
        shell: bash
        run: |
          node --input-type=module <<'NODE' > supabase-mock.log 2>&1 &
          import http from "node:http";

          http
            .createServer((request, response) => {
              response.setHeader("content-type", "application/json");
              if (request.url?.includes("/.well-known/jwks.json")) {
                response.writeHead(200);
                response.end(JSON.stringify({ keys: [] }));
                return;
              }
              if (request.url?.includes("/auth/v1/user")) {
                response.writeHead(401);
                response.end(JSON.stringify({ message: "No authorization header" }));
                return;
              }
              response.writeHead(200);
              response.end(JSON.stringify({}));
            })
            .listen(54321, "127.0.0.1");
          NODE
          echo $! > supabase-mock.pid

      - name: Build production app
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify every non-admin route
        shell: bash
        run: |
          set -o pipefail
          pnpm start > playwright-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat playwright-server.log
              exit 1
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3000 >/dev/null
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 pnpm test:styles:e2e 2>&1 | tee playwright-styles.log

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-style-playwright
          path: |
            playwright-artifacts/
            playwright-server.log
            playwright-styles.log
            supabase-mock.log
          if-no-files-found: warn
          retention-days: 7
